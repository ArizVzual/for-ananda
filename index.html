<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF8F0">
  <meta name="description" content="A little birthday surprise, made with love. A world of memories, wishes, and little things worth keeping.">
  <title>A little birthday surprise</title>
  <link rel="icon" href="assets/icons/heart.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/vendor/lucide.min.js"></script>
  <script defer src="js/vendor/confetti.browser.min.js"></script>
  <script defer src="js/animations.js"></script>
  <script defer src="js/music.js"></script>
  <script defer src="js/gallery.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body class="is-opening">
  <noscript><div class="noscript">Aktifkan JavaScript untuk membuka hadiah interaktif ini.</div></noscript>
  <a class="skip-link" href="#hero">Lewati ke isi halaman</a>
  <section id="opening" class="opening" aria-labelledby="opening-title">
    <div class="opening-top"><span class="mini-heart" aria-hidden="true">♡</span><span data-copy="edition"></span></div>
    <div class="floating-petals" aria-hidden="true"><span>♡</span><span>✧</span><span>♡</span><span>✧</span><span>✦</span><span>♡</span></div>
    <img class="flower opening-flower-left" src="assets/icons/botanical.svg" alt="">
    <img class="flower opening-flower-right" src="assets/icons/botanical.svg" alt="">
    <div class="opening-content">
      <p class="eyebrow" data-copy="openingEyebrow"></p>
      <h1 id="opening-title" data-copy="openingTitle"></h1>
      <p class="opening-description" data-copy="openingText"></p>
      <div class="gift-scene" aria-hidden="true">
        <span class="gift-spark spark-one">✧</span><span class="gift-spark spark-two">✧</span>
        <div class="gift-glow"></div><div class="gift-box"><div class="gift-lid"><div class="bow bow-left"></div><div class="bow bow-right"></div><span class="ribbon-knot"></span></div><div class="gift-base"></div><div class="gift-tag">with love ♡</div><span class="gift-heart">♡</span></div>
      </div>
      <p class="script opening-note" data-copy="openingNote"></p>
      <button id="open-gift" class="button primary"><span data-copy="openButton"></span><i data-lucide="gift"></i></button>
      <p class="sound-hint"><i data-lucide="music-2"></i><span data-copy="soundHint"></span></p>
    </div>
    <p class="opening-footer" data-copy="openingFootnote"></p>
  </section>

  <div id="experience" hidden inert>
    <header class="site-header">
      <a class="wordmark" href="#hero"><span data-copy="brand"></span></a>
      <nav aria-label="Bagian hadiah"><a href="#memories" data-nav="0"></a><a href="#reasons" data-nav="1"></a><a href="#letter" data-nav="2"></a><a href="#wish" data-nav="3"></a></nav>
      <button class="icon-button logo-heart" id="secret-heart" aria-label="Sebuah hati kecil"><i data-lucide="heart"></i></button>
    </header>
    <main>
      <section id="hero" class="hero section-shell">
        <div class="hero-copy">
          <div class="eyebrow hero-eyebrow"><span class="fine-line"></span><span data-copy="heroEyebrow"></span></div>
          <h1 tabindex="-1" id="birthday-heading"><span data-copy="heroTitle"></span><em data-name></em><span class="name-rest" data-full-name></span></h1>
          <p class="date-pill"><i data-lucide="calendar-heart"></i><time data-date></time></p>
          <p class="hero-description" data-copy="heroText"></p>
          <p class="script hero-note" data-copy="heroNote"></p>
          <a class="text-link" href="#memories"><span data-copy="heroButton"></span><i data-lucide="arrow-down"></i></a>
        </div>
        <div class="hero-art" id="hero-art">
          <span class="orbit orbit-one" aria-hidden="true"></span><span class="orbit orbit-two" aria-hidden="true"></span>
          <span class="handwritten hero-sticker" data-copy="heroSticker"></span>
          <div class="hero-polaroid polaroid"><span class="tape" aria-hidden="true"></span><div class="photo-slot hero-photo" id="main-photo"></div><p class="script" data-copy="heroCaption"></p></div>
          <img class="flower hero-flower" src="assets/icons/botanical.svg" alt="">
          <span class="hero-heart" aria-hidden="true">♡</span><span class="hero-star" aria-hidden="true">✧</span>
          <div class="round-stamp" aria-hidden="true">JUST FOR YOU<br><span>♡</span><br>WITH ALL MY LOVE</div>
        </div>
        <div class="hero-bottom"><span>01 / A BIRTHDAY TO REMEMBER</span><span class="little-flower" aria-hidden="true">✳</span><span data-copy="edition"></span></div>
      </section>

      <section id="memories" class="memories section-pad">
        <div class="section-heading reveal"><p class="eyebrow">THE PAGES I KEEP CLOSE</p><h2 data-copy="memoriesTitle"></h2><p class="script" data-copy="memoriesSubtitle"></p><p class="section-note" data-copy="memoriesNote"></p></div>
        <div class="gallery-wrap section-shell"><div id="gallery" class="gallery" aria-label="Galeri kenangan"></div></div>
        <div class="gallery-controls"><button class="icon-button" id="gallery-prev" aria-label="Foto sebelumnya"><i data-lucide="arrow-left"></i></button><p data-copy="galleryHint"></p><button class="icon-button" id="gallery-next" aria-label="Foto berikutnya"><i data-lucide="arrow-right"></i></button></div>
      </section>

      <section id="reasons" class="reasons section-pad section-shell">
        <div class="section-heading reveal"><p class="eyebrow">IT'S ALWAYS THE LITTLE THINGS</p><h2 data-copy="reasonsTitle"></h2><p class="script" data-copy="reasonsSubtitle"></p></div>
        <div id="reason-grid" class="reason-grid"></div>
      </section>

      <section id="letter" class="letter-section section-pad">
        <img class="flower letter-flower" src="assets/icons/botanical.svg" alt="" loading="lazy">
        <div class="section-heading reveal"><p class="eyebrow">WORDS I'VE BEEN SAVING FOR YOU</p><h2 data-copy="letterTitle"></h2><p class="script" data-copy="letterSubtitle"></p></div>
        <div class="letter-stage" id="letter-stage">
          <div class="envelope" aria-hidden="true"><div class="envelope-paper"><span class="script" data-copy="letterEnvelope"></span><span>♡</span></div><div class="envelope-front"></div><div class="envelope-flap"></div><div class="wax-seal">♡</div></div>
          <button id="open-letter" class="button primary" aria-expanded="false" aria-controls="letter-paper"><span data-copy="letterButton"></span><i data-lucide="mail-open"></i></button>
          <article id="letter-paper" class="letter-paper" hidden aria-label="Surat cinta">
            <div class="letter-toolbar"><span class="eyebrow">A NOTE FROM MY HEART</span><button id="full-letter" class="small-button" data-copy="fullLetterButton"></button></div>
            <div class="letter-body" id="letter-body" tabindex="0"><div id="letter-typed" aria-hidden="true"></div><div id="letter-accessible" class="sr-only"></div></div>
            <p class="letter-signature script"><span data-copy="letterSignature"></span><span id="sender-name"></span><span class="signature-heart">♡</span></p>
            <button id="close-letter" class="text-link" data-copy="letterClose"></button>
          </article>
        </div>
      </section>

      <section id="wish" class="wish-section section-pad section-shell">
        <div class="section-heading reveal"><p class="eyebrow">HERE'S TO YOUR BEAUTIFUL TOMORROWS</p><h2 data-copy="wishTitle"></h2><p class="script" data-copy="wishSubtitle"></p></div>
        <div class="cake-stage" role="img" aria-label="Kue ulang tahun dengan tiga lilin menyala" id="cake">
          <span class="cake-spark cake-spark-one" aria-hidden="true">✧</span><span class="cake-spark cake-spark-two" aria-hidden="true">✦</span>
          <div class="candles"><div class="candle"><span class="flame"></span><span class="smoke"></span></div><div class="candle"><span class="flame"></span><span class="smoke"></span></div><div class="candle"><span class="flame"></span><span class="smoke"></span></div></div>
          <div class="cake-top"></div><div class="cake-body"><div class="icing"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><div class="cake-ribbon"></div><span class="cake-decoration">♡</span></div><div class="cake-plate"></div>
        </div>
        <div class="wish-copy"><p data-copy="wishIntro"></p><p data-copy="wishText"></p><p class="script" data-copy="wishNote"></p></div>
        <button class="button primary" id="blow-candles"><i data-lucide="wind"></i><span data-copy="blowButton"></span></button>
        <div id="wish-result" hidden role="status"><p class="script" data-copy="wishResult"></p><p data-copy="wishResultNote"></p><button class="text-link" id="relight"><i data-lucide="flame"></i><span data-copy="relightButton"></span></button></div>
      </section>

      <section class="final-invite section-pad"><div class="tiny-divider" aria-hidden="true"><span></span>♡<span></span></div><button id="last-surprise" class="button final-button"><span data-copy="finalButton"></span><i data-lucide="arrow-up-right"></i></button></section>
    </main>
    <footer class="footer"><span class="script" data-copy="brand"></span><p data-copy="footer"></p><span data-date></span></footer>
    <aside id="music-player" class="music-player" aria-label="Pemutar musik">
      <div class="record-icon"><i data-lucide="music-2"></i></div><div class="track-label"><span data-copy="trackTitle"></span><small data-copy="trackSubtitle"></small></div>
      <span class="equalizer" aria-hidden="true"><b></b><b></b><b></b></span>
      <button id="music-toggle" class="icon-button" aria-label="Putar musik"><i data-lucide="play"></i></button><button id="music-mute" class="icon-button" aria-label="Bisukan musik" aria-pressed="false"><i data-lucide="volume-2"></i></button>
    </aside>
  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Foto kenangan"><button id="close-lightbox" class="icon-button dialog-close" aria-label="Tutup foto"><i data-lucide="x"></i></button><div id="lightbox-photo" class="lightbox-photo"></div><p id="lightbox-caption"></p><div class="lightbox-controls"><button id="lightbox-prev" class="icon-button" aria-label="Foto sebelumnya"><i data-lucide="arrow-left"></i></button><span id="lightbox-count" aria-live="polite"></span><button id="lightbox-next" class="icon-button" aria-label="Foto berikutnya"><i data-lucide="arrow-right"></i></button></div></dialog>
  <dialog id="finale" class="finale" aria-label="Kejutan terakhir"><button id="close-finale" class="icon-button dialog-close" aria-label="Tutup kejutan"><i data-lucide="x"></i></button><div class="finale-stars" aria-hidden="true"></div><div class="finale-content"><div class="finale-heart" aria-hidden="true">♡</div><div id="finale-lines"></div><div id="finale-ending" hidden><p class="eyebrow" data-copy="heroTitle"></p><h2 data-recipient></h2><p data-copy="finalThanks"></p><p class="script" data-copy="finalSignature"></p><button id="replay" class="button light-button"><i data-lucide="rotate-ccw"></i><span data-copy="replayButton"></span></button></div></div><img class="flower finale-flower left" src="assets/icons/botanical.svg" alt=""><img class="flower finale-flower right" src="assets/icons/botanical.svg" alt=""></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
